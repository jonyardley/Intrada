<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400&display=swap">
  <style>
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7A6A5A; } a:hover { color: #3B2A1E; }
  </style>
</helmet>
<div style="width: 390px; height: 560px; background: linear-gradient(180deg, #F7F4EF 0%, #F3EFE8 100%); display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 52px; border-bottom: 1px solid #ECE6DA;">
    <div style="min-width: 56px; font-size: 17px; color: #3B2A1E;">&nbsp;</div>
    <div style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600; color: #3B2A1E;">Switch variation</div>
    <div style="min-width: 56px; text-align: right; font-size: 17px; font-weight: 600; color: #3B2A1E;">Done</div>
  </div>

  <div style="display: flex; flex-direction: column; padding-top: 8px;">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 17px; font-weight: 500; color: #3B2A1E;">C major</div>
          <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; color: #A99C8C;">Playing now &middot; 4:10</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#3B2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>
      </div>
      <div style="height: 1px; background: #ECE6DA; margin: 0 16px;"></div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 17px; font-weight: 500; color: #3B2A1E;">G major</div>
          <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; color: #3B2A1E;">Solid &middot; 9 of 10</div>
        </div>
        
      </div>
      <div style="height: 1px; background: #ECE6DA; margin: 0 16px;"></div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 17px; font-weight: 500; color: #3B2A1E;">D major</div>
          <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; color: #A99C8C;">5 of 10</div>
        </div>
        
      </div>
      <div style="height: 1px; background: #ECE6DA; margin: 0 16px;"></div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 17px; font-weight: 500; color: #3B2A1E;">A major</div>
          <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; color: #A99C8C;">Not yet played</div>
        </div>
        
      </div>
      <div style="height: 1px; background: #ECE6DA; margin: 0 16px;"></div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 17px; font-weight: 500; color: #3B2A1E;">E major</div>
          <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; color: #A99C8C;">Not yet played</div>
        </div>
        
      </div>
  </div>

  <div style="padding: 16px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; color: #A99C8C; line-height: 1.45;">Switching starts a fresh count of repetitions.</div>

</div>
</x-dc>
</body>
</html>
