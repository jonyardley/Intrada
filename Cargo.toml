[workspace]
# Active build = the native iOS stack (core + ffi) and the API; the earlier
# web and mobile-host crates were removed (see docs/rebuild-review.md).
members = [
  "crates/intrada-core",
  "crates/intrada-ffi",
  "crates/intrada-api",
]
resolver = "2"
# MSRV floor, set by crux_core 0.20's own rust-version. The dev/CI toolchain is
# newer (rust-toolchain.toml). intrada-api depends on intrada-core, so it
# inherits this floor too — it has no lower one of its own.
package.rust-version = "1.90"

[workspace.dependencies]
crux_core = "0.20.0"
crux_http = "0.20.0" # tracks crux_core: a capability on 0.19 pulls in a second, incompatible crux_core
# Pinned exactly because crux_core 0.20's facet_generate 0.19 pins it too.
# Two facet versions in one tree surface as `Facet<'_> is not satisfied`
# rather than a version conflict.
facet = "=0.46.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# Title collation: folds accents onto their base letter so "Étude" files under
# E rather than after every ASCII title (#1447).
unicode-normalization = "0.1"
# Reads the authored content (content/gates.toml) at startup. `parse` only:
# the engine never writes TOML back.

[profile.dev.package."*"]
debug = false

[profile.dev]
debug = "line-tables-only"
