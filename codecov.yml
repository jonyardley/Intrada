# Codecov configuration — informational, not blocking.
# Coverage data helps spot gaps; it doesn't gate merges.

coverage:
  status:
    # Project-level coverage (overall %) — off. Too noisy at this stage
    # and penalises PRs that touch uncovered legacy code.
    project: false

    # Patch coverage (new/changed lines) — informational only.
    # Target 70%: low enough to not block diagnostic/glue code,
    # high enough to flag PRs that ship zero tests for real logic.
    patch:
      default:
        target: 70%
        informational: true

comment:
  # Show the Codecov PR comment but keep it compact.
  layout: "reach,diff,flags,files"
  behavior: default
  # Comment on every PR that has a report, changed coverage or not. Always(6)
  # has the author compare this comment against the PR's `Coverage:` line, and
  # a check that only sometimes produces the thing being compared is one nobody
  # can tell has stopped running (#1288).
  require_changes: false
  require_base: false        # don't fail if base commit has no coverage
  require_head: true

ignore:
  # Native iOS Swift shell — intentionally not coverage-tracked. The coverage
  # job is Rust-only (cargo-llvm-cov); the shell is a dumb pipe whose logic
  # lives in the Crux core (covered above). Swift unit tests exist but aren't
  # measured. Wiring xccov→Codecov is tracked in #896 (horizon:later).
  - "ios/**"
