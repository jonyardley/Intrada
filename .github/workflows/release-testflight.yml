name: Release — TestFlight

# Signed device build → TestFlight. Manual or on a v* tag ONLY — never per-PR
# (macOS runners are 10×-billed). See specs/ios-testflight-cicd.md.
on:
  workflow_dispatch:
  push:
    # X.Y.Z only: the beta lane hard-rejects other shapes, and failing at the
    # trigger beats failing after ~15 min of 10x-billed macOS build.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Don't cancel an in-flight upload if another tag/dispatch lands.
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"
  SENTRY_ORG: jon-yardley

jobs:
  testflight:
    name: Build + upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # First step of all: a build that cannot report crashes is invisible until
      # someone needs a crash report (#1553), so fail before the checkout and
      # the 10x-billed macOS build rather than after the upload.
      - name: Require the Sentry secrets on a tagged release
        if: github.ref_type == 'tag'
        env:
          SENTRY_DSN_NATIVE: ${{ secrets.SENTRY_DSN_NATIVE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          case "${SENTRY_DSN_NATIVE:-}" in
            *[[:space:]]*)
              echo "::error::SENTRY_DSN_NATIVE carries whitespace, which survives into the build and leaves the SDK rejecting the DSN at launch. Re-set it with: printf %s '<dsn>' | gh secret set SENTRY_DSN_NATIVE"
              exit 1
              ;;
            https://*)
              echo "Sentry DSN present: this build will report crashes."
              ;;
            *)
              echo "::error::SENTRY_DSN_NATIVE is unset or is not an https DSN, so this build would ship with Sentry off. Set it with: gh secret set SENTRY_DSN_NATIVE"
              exit 1
              ;;
          esac
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is unset, so this build will report its crashes but no release will be created to file them against."
          fi
      # Full history: `sentry-cli releases set-commits --auto` reads the local
      # git log to work out what went into the release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pin Xcode 26.6 to match local dev + the native-ios CI job.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "release-testflight"
          cache-on-failure: true
      # dtolnay/rust-toolchain skips adding ~/.cargo/bin to PATH on the macOS
      # image; without this `cargo` resolves to Apple's stub. (See ci.yml.)
      - name: Ensure cargo is on PATH
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          cargo --version
      - uses: taiki-e/install-action@v2.87.9
        with:
          tool: just
      - name: Cache cargo-swift
        id: cargo-swift-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-swift
          key: cargo-swift-0.9.0-${{ runner.os }}-${{ runner.arch }}
      # Pinned 0.9.0 — its bundled uniffi-bindgen matches our uniffi crate's
      # runtime contract. Bump in lockstep with uniffi. (See ci.yml / CLAUDE.md.)
      - name: Install cargo-swift
        if: steps.cargo-swift-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-swift --version "=0.9.0" --locked
      - name: Cache xcodegen
        id: xcodegen-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/xcodegen
            /usr/local/share/xcodegen
          key: xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}
      # Pinned 2.46.0 in lockstep with ci.yml's native-ios-build and
      # native-ios-build-release (see the comment there for why brew is not
      # used). The "Version pins agree" guard in ci.yml checks this pin too.
      - name: Install xcodegen
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp
          /tmp/xcodegen/install.sh
      # RELEASE core (debug cores are 10-100× slower in hot paths). cargo-swift
      # --platforms ios emits the aarch64-apple-ios device slice the archive needs.
      - name: Regenerate Swift bindings (release core)
        run: |
          just ios-typegen
          just ios-package release
      # The DSN expands into the SENTRY_DSN build setting here; ios/project.yml
      # explains the route from there to the plist. Without it the app's start
      # gate keeps Sentry off and the build reports nothing (#1553).
      - name: Generate Xcode project
        working-directory: ios
        env:
          SENTRY_DSN_NATIVE: ${{ secrets.SENTRY_DSN_NATIVE }}
        run: xcodegen generate
      - name: Confirm the DSN reached the generated project
        if: github.ref_type == 'tag'
        run: |
          if ! grep -qE 'SENTRY_DSN = "?https://' ios/Intrada.xcodeproj/project.pbxproj; then
            echo "::error::The generated project carries no https SENTRY_DSN, so this build would ship with Sentry off."
            exit 1
          fi
          echo "SENTRY_DSN is baked into the generated project."
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Empty on branch dispatch; the Fastfile then falls back to project.yml.
          MARKETING_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bundle exec fastlane ios beta
      # sentry-cli, not ci.yml's getsentry/action-release: that is a Docker
      # container action and cannot run on a macOS runner. The name is read off
      # the uploaded .ipa, the three keys `SentryRelease.swift` composes (#1553).
      #
      # Tag only, so a hand-run dispatch cannot file a release under the version
      # sitting in project.yml. continue-on-error so a Sentry outage cannot fail
      # a build that has already reached testers; the ERR trap is what keeps
      # that from also hiding a fault of our own.
      - name: Create the Sentry release for this build
        if: github.ref_type == 'tag' && env.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: intrada-mobile
        run: |
          set -euo pipefail
          trap 'echo "::warning::No Sentry release was created for this build, so its crashes will arrive unattributed."' ERR

          ipas=(build/*.ipa)
          ipa="${ipas[0]}"
          if [ ! -f "$ipa" ]; then
            echo "::warning::No .ipa under build/, so no Sentry release was created for this build."
            exit 0
          fi

          curl -fsSL -o "$RUNNER_TEMP/sentry-cli" \
            "https://downloads.sentry-cdn.com/sentry-cli/3.7.0/sentry-cli-Darwin-universal"
          chmod +x "$RUNNER_TEMP/sentry-cli"

          unzip -o -q "$ipa" "Payload/*.app/Info.plist" -d "$RUNNER_TEMP/ipa"
          plists=("$RUNNER_TEMP"/ipa/Payload/*.app/Info.plist)
          plist="${plists[0]}"
          key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          # Separately, so a missing key trips `set -e`: in one interpolation the
          # assignment takes only the last substitution's status and a half-built
          # name would be created and finalised.
          identifier="$(key CFBundleIdentifier)"
          short_version="$(key CFBundleShortVersionString)"
          build_number="$(key CFBundleVersion)"
          for field in "$identifier" "$short_version" "$build_number"; do
            if [ -z "$field" ]; then
              echo "::error::The uploaded build's Info.plist is missing an identity field, so no release name could match its crashes."
              exit 1
            fi
          done
          release="$identifier@$short_version+$build_number"
          echo "Sentry release: $release"

          "$RUNNER_TEMP/sentry-cli" releases new "$release"
          "$RUNNER_TEMP/sentry-cli" releases set-commits "$release" --auto \
            || echo "::warning::Could not associate commits with $release, which is created either way. Check the Sentry GitHub integration, that the repository is associated, and the token's org:read scope."
          "$RUNNER_TEMP/sentry-cli" releases finalize "$release"
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intrada-ipa
          path: build/*.ipa
          retention-days: 14
          if-no-files-found: ignore
