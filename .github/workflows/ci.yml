name: CI

on:
  push:
    branches: [main]
  # Run on every PR regardless of target branch — stacked PRs (where the
  # target is a feature branch, not main) need CI too. Without this filter
  # the workflow only triggers when the target is `main`, leaving stacked
  # PRs with "no checks reported" until they're rebased onto main.
  pull_request:
    # Explicit types, adding labeled/unlabeled to the default set (opened,
    # synchronize, reopened): the comments-justified bypass (#1433) needs a
    # label change to start a fresh run, since re-running an old one replays
    # the pre-label payload and fails again.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Cancel in-flight runs when a new commit lands on the same PR. Don't cancel
# main-branch runs — those gate deploys, so we want every commit's build to
# complete and produce its own deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

env:
  RUST_VERSION: "1.97.1"
  SENTRY_ORG: jon-yardley

jobs:
  # Detects which paths changed in the PR — used to skip jobs whose inputs
  # haven't changed. Always-true on main pushes (so deploys see every job).
  # Runs cheaply (~5s) on every event.
  changes:
    name: Path Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      api: ${{ steps.filter.outputs.api }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - '.github/workflows/ci.yml'
            api:
              - 'Dockerfile'
              - 'rust-toolchain.toml'
              - 'crates/intrada-api/**'
              - '.github/workflows/ci.yml'
            native:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/intrada-core/**'
              - 'crates/intrada-ffi/**'
              - 'ios/**'
              - 'scripts/ios-run-sim.sh'
              - 'justfile'
              - '.github/workflows/ci.yml'
      # Drift installs clippy/rustfmt for the env's version, then cargo resolves
      # to the file's: "clippy is not installed", or a silent second download.
      # Checks every workflow's RUST_VERSION, not just this file's — so a
      # third lane (or release-testflight.yml's own copy) is covered by
      # construction rather than by remembering to hand-edit it too (#1341).
      - name: Toolchain pins agree
        run: |
          pinned=$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          for wf in .github/workflows/*.yml; do
            version=$(grep -oE '^[[:space:]]*RUST_VERSION: "[^"]+"' "$wf" | grep -oE '"[^"]+"' | tr -d '"')
            if [ -n "$version" ] && [ "$version" != "$pinned" ]; then
              echo "$wf pins RUST_VERSION $version but rust-toolchain.toml pins $pinned"
              exit 1
            fi
          done
      # cargo-swift's bundled uniffi-bindgen must match our uniffi runtime
      # contract exactly (native-ios-build's "Install cargo-swift" comment), so
      # its pin must agree across mise.toml and every workflow that installs it.
      # xcodegen has two lockstep occurrences in THIS file (native-ios-build and
      # native-ios-build-release must generate from the same release) plus a
      # third in release-testflight.yml, which now installs the identical
      # pinned release zip instead of an unpinned `brew install xcodegen`
      # (#1556), so all three copies are compared here. A bump to one copy
      # and not its siblings silently installs a mismatched
      # cargo-swift/uniffi-bindgen pair (the #846 class CLAUDE.md warns
      # about) or builds the Xcode project from a different XcodeGen release
      # than every CI run validated. Each half fails loudly when its pin is
      # missing, so a reworded cache key cannot turn the guard into a green
      # no-op.
      - name: Version pins agree (cargo-swift and xcodegen across files)
        run: |
          swift_pinned=$(grep -oE '"cargo:cargo-swift" = "[^"]+"' mise.toml | cut -d'"' -f4)
          if [ -z "$swift_pinned" ]; then
            echo "no cargo-swift pin in mise.toml: the guard would be a no-op"
            exit 1
          fi
          swift_seen=0
          for wf in .github/workflows/ci.yml .github/workflows/release-testflight.yml; do
            while read -r v; do
              swift_seen=$((swift_seen + 1))
              if [ "$v" != "$swift_pinned" ]; then
                echo "$wf pins cargo-swift $v but mise.toml pins $swift_pinned"
                exit 1
              fi
            done < <(grep -oE 'cargo-swift.*[0-9]+\.[0-9]+\.[0-9]+' "$wf" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          done
          if [ "$swift_seen" -eq 0 ]; then
            echo "no cargo-swift version in any workflow: the guard would be a no-op"
            exit 1
          fi
          xcodegen_pins=$(grep -ohE 'xcodegen[-/][0-9]+\.[0-9]+\.[0-9]+|download/[0-9]+\.[0-9]+\.[0-9]+/xcodegen' \
            .github/workflows/ci.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ -z "$xcodegen_pins" ]; then
            echo "no xcodegen pin in ci.yml: the guard would be a no-op"
            exit 1
          fi
          if [ "$(printf '%s\n' "$xcodegen_pins" | wc -l)" -gt 1 ]; then
            echo "xcodegen pins disagree within ci.yml: $xcodegen_pins"
            exit 1
          fi
          # The install-URL form only: the cache key alone would still carry
          # a stale version if the pinned download step were ever reverted to
          # a bare brew install while its cache step stayed behind, silently
          # turning this half of the guard into a no-op (#1556).
          xcodegen_release_pins=$(grep -ohE 'download/[0-9]+\.[0-9]+\.[0-9]+/xcodegen' \
            .github/workflows/release-testflight.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ -z "$xcodegen_release_pins" ]; then
            echo "no xcodegen pin in release-testflight.yml: the guard would be a no-op"
            exit 1
          fi
          if [ "$xcodegen_release_pins" != "$xcodegen_pins" ]; then
            echo "release-testflight.yml pins xcodegen $xcodegen_release_pins but ci.yml pins $xcodegen_pins"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Runs on push to main as well as on PRs, and it has to: a PR comment is a
    # comparison, so with no report on the base commit there is nothing to
    # compare and Codecov posts nothing. `main` had never uploaded once, which
    # is why the dashboard was empty and no PR had been commented on (#1288).
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "native"
          cache-on-failure: true
      # nextest runs the same assertions as `cargo test` but with a smarter
      # scheduler: typically 40 to 50% faster.
      - uses: taiki-e/install-action@v2.87.4
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # One instrumented run emits both the junit XML dorny/test-reporter
      # reads and the Codecov upload, so the workspace builds once per run
      # instead of twice (#1517: measured 1.64x instrumented-vs-plain
      # locally, under the 2x this was worth folding at).
      - name: Generate coverage
        run: >
          cargo llvm-cov nextest
          --workspace
          --profile ci
          --codecov
          --output-path codecov.json
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Test Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      # Read the floor from Cargo.toml rather than pinning it again here: the
      # toolchain we build with is seven minors above it, so nothing else fails.
      - id: floor
        run: |
          version=$(grep -oE 'package.rust-version = "[^"]+"' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "msrv"
          cache-on-failure: true
      # `+toolchain` beats rust-toolchain.toml, which would otherwise pull the
      # current pin straight back in.
      - run: cargo +${{ steps.floor.outputs.version }} check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      # rust-cache's key is `<prefix-key>-<job>-…`, so `native` here asked for
      # `native-clippy-…`, which nothing writes: this job restored nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.4
        with:
          tool: clippy-sarif,sarif-fmt
      # Run clippy with JSON output piped through clippy-sarif for GitHub
      # code scanning annotations, then check the exit code to fail the job.
      # --all-targets so test/bench code is linted too, not just lib/bin — a
      # dropped `#[must_use]` Command shipped in a test once because the gate
      # stopped at lib targets.
      - name: Clippy (native)
        shell: bash
        run: |
          set +o pipefail
          cargo clippy --workspace --all-targets \
            --message-format=json -- -D warnings 2>&1 \
            | clippy-sarif | tee clippy-native.sarif | sarif-fmt
          exit "${PIPESTATUS[0]}"
      - name: Upload Clippy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clippy-native.sarif
          category: clippy-native
          wait-for-processing: true

  native-ios-build:
    # Native SwiftUI app, build half — regenerate bindings (facet typegen +
    # cargo-swift), build the test products once. Pinned to macos-26 + Xcode
    # 26.5 so the toolchain matches local dev (and the spec's iOS 26 SDK):
    # SwiftUI snapshots are renderer-specific, so dev and CI MUST share
    # Xcode/iOS.
    #
    # Fanned out (#1207): this job builds once and uploads the built test
    # products (app + .xctest bundles, not all of DerivedData) as an artifact;
    # `native-ios-test-unit` and `native-ios-test-ui` consume it in parallel
    # instead of each rebuilding, and `native-ios-build-release` compiles the
    # Release configuration alongside them rather than ahead of them.
    name: "Native iOS: build"
    # Self-hosted runs are opt-in through the IOS_RUNNER repo variable, so the
    # Mac can be pulled out of CI in one click when it is asleep, busy or
    # mid-update, without a workflow edit. Deleting the variable falls back to
    # macos-26 rather than leaving an empty `runs-on`, which queues the job
    # until it times out instead of failing. A fork PR always goes to macos-26:
    # untrusted code must never execute on a self-hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-26' || vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 40
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v7
      # Pin Xcode 26.5 on the hosted runner to match the recorded snapshot
      # reference. Skipped when self-hosted: that Mac carries one Xcode, and
      # this action errors rather than falling back to it (#1577). Snapshot
      # rendering comes from the iOS 26.5 runtime either way, which both
      # machines have; what differs is the Swift toolchain and swift format.
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: "26.5"
      - uses: taiki-e/install-action@v2.87.4
        with:
          tool: just
      # Swift formatting gate (mirror of cargo fmt --check). Needs only the
      # Xcode toolchain, so it runs first and fails fast. The version print
      # diagnoses formatter-default drift between the Xcode pin and local dev.
      - name: swift format check
        run: |
          swift format --version
          just ios-fmt-check
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "native-ios"
          cache-on-failure: true
      # dtolnay/rust-toolchain skips adding ~/.cargo/bin to PATH on the macOS
      # image; without this `cargo` resolves to Apple's stub. (See ios-build.)
      # CARGO_HOME is set on the hosted image and unset on the self-hosted
      # runner, where rustup used the default location.
      - name: Ensure cargo is on PATH
        run: |
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          cargo --version
      # iOS-only `#[cfg(target_os = "ios")]` branches in the FFI crate can't be
      # linted by the Linux `clippy` job (no Apple SDK); lint them here against
      # the device target. Runs before the expensive build so it fails fast.
      - name: Clippy (iOS device target)
        run: cargo clippy -p intrada-ffi --target aarch64-apple-ios -- -D warnings
      - name: Cache cargo-swift
        id: cargo-swift-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-swift
          key: cargo-swift-0.9.0-${{ runner.os }}-${{ runner.arch }}
      # Pinned to 0.9.0: its bundled uniffi-bindgen matches our uniffi=0.29.4
      # crate's runtime contract version (the combo the crux example uses).
      # Newer cargo-swift bundles a different bindgen → runtime contract
      # mismatch crash. Bump this WITH the uniffi crate, in lockstep.
      - name: Install cargo-swift
        if: steps.cargo-swift-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-swift --version "=0.9.0" --locked
      - name: Cache xcodegen
        id: xcodegen-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/xcodegen
            /usr/local/share/xcodegen
          key: xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}
      # Pinned to 2.46.0, installed from XcodeGen's own GitHub release zip
      # rather than `brew install xcodegen`: Homebrew has no `xcodegen@2.46.0`
      # formula to pin to, and current Homebrew rejects installing a loose
      # formula file outside a tap, so a version pin would need a full
      # homebrew-core git clone at a fixed commit — much heavier than the
      # 4MB release zip. `native-ios-build` and `native-ios-build-release`
      # both resolve xcodegen independently within one CI run, so a formula
      # bump landing mid-run could generate the two projects from different
      # versions. Bump this WITH the identical step in
      # `native-ios-build-release`, in lockstep.
      - name: Install xcodegen
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp
          /tmp/xcodegen/install.sh
      # The generated bindings (ios/generated: cargo-swift's IntradaCoreFFI
      # xcframework + facet's SharedTypes) are a pure function of the core/ffi
      # source, the locked dep versions (uniffi/crux contract — Cargo.lock), and
      # the cargo-swift version. So we cache them and only regenerate on a miss:
      # a Swift-only PR (touches ios/**, not the core) gets an exact hit and
      # skips the ~28s regen. The key MUST capture everything the output depends
      # on — a stale hit here is a uniffi/crux contract mismatch that crashes the
      # app at runtime (the failure mode CLAUDE.md warns about). Bump the
      # `cargoswift-0.9.0` token in lockstep with the `Install cargo-swift`
      # version pin above.
      - name: Cache generated Swift bindings
        id: bindings-cache
        uses: actions/cache@v6
        with:
          path: ios/generated
          key: ios-bindings-cargoswift-0.9.0-${{ runner.os }}-${{ hashFiles('crates/intrada-core/src/**', 'crates/intrada-ffi/src/**', 'crates/intrada-core/Cargo.toml', 'crates/intrada-ffi/Cargo.toml', 'Cargo.lock') }}
      - name: Regenerate Swift bindings (facet typegen + cargo-swift)
        if: steps.bindings-cache.outputs.cache-hit != 'true'
        run: just ios-gen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      # Resolved SwiftPM package sources (Sentry, swift-snapshot-testing + its
      # heavy swift-syntax dep, GRDB) get their own cache keyed on project.yml —
      # where the version constraints are declared, so it changes rarely and is a
      # near-guaranteed hit. This removes the network re-resolve/re-clone that
      # drove the snapshot-step run-to-run variance (#813). Relocated out of
      # DerivedData via `-clonedSourcePackagesDirPath build/spm` (in the snapshot
      # step below) so this cache and the DerivedData cache never overlap on the
      # same path. Stable sources also make Xcode's incremental check on the
      # restored DerivedData a no-op, so the compiled deps get reused instead of
      # rebuilt. Restore-then-save-on-main, not `save-if`: that is not an
      # `actions/cache` input at all and was being ignored, so every PR branch
      # wrote its own 928MB copy that no other ref can read.
      - name: Restore SwiftPM packages
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: ios/build/spm
          key: ios-spm-v1-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ios-spm-v1-${{ runner.os }}-
      # Cache DerivedData (compiled SwiftPM dep products + build intermediates;
      # the resolved package *sources* are cached separately above) so
      # `xcodebuild test` rebuilds incrementally instead of recompiling the whole
      # dependency tree every run. derivedDataPath is the stable relative
      # `build/dd`, so cached absolute paths line up across runs. The exact key
      # rarely hits (Swift source changes per PR); the restore-key pulls the most
      # recent DerivedData and Xcode rebuilds only what changed. Safe for snapshot
      # determinism: this caches compilation only — rendering happens at runtime
      # in the simulator, so a cache hit can't alter a snapshot result (a stale
      # incremental build fails loud, it can't silently pass). Bump the key prefix
      # to force-evict.
      - name: Restore iOS DerivedData
        id: dd-cache
        uses: actions/cache/restore@v6
        with:
          path: ios/build/dd
          key: ios-dd-v2-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/Intrada/**', 'ios/IntradaTests/**') }}
          restore-keys: |
            ios-dd-v2-${{ runner.os }}-
      # Build only, via the same `_ios-build-for-testing` recipe local dev's
      # `_ios-test-run` calls (#1198, split further in #1207) — the
      # xcodebuild invocation lives in exactly one place shared between CI and
      # local, instead of a hand-copied one that can drift from it. The
      # reference is recorded on iOS 26.5 / Xcode 26.5 (= local dev); SwiftUI
      # snapshots are renderer-specific — bump the pin in the justfile + the
      # reference together when local dev moves to a newer Xcode/iOS.
      - name: Build for testing (just _ios-build-for-testing)
        run: just _ios-build-for-testing
      # Not all of DerivedData — just the built app + .xctest bundles (and the
      # .xctestrun that points at them) the test-without-building jobs need.
      # ios/build/dd is a relative derivedDataPath under the same checkout
      # layout in every job, so the .xctestrun's embedded __TESTROOT__
      # resolves the same way there as it did here (#1207).
      - name: Upload built test products
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-test-products
          path: ios/build/dd/Build/Products
          retention-days: 1
      # Below the artefact upload so several GB of compression can't delay the
      # three jobs waiting on it, and keyed off the restore so an unchanged
      # `project.yml` doesn't archive 928MB just to fail the reservation.
      - name: Save SwiftPM packages
        if: github.ref == 'refs/heads/main' && steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ios/build/spm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
      - name: Save iOS DerivedData
        if: github.ref == 'refs/heads/main' && steps.dd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ios/build/dd
          key: ${{ steps.dd-cache.outputs.cache-primary-key }}

  native-ios-build-release:
    # Debug and Release diverge on `#if DEBUG`-gated code (#1177): the Debug
    # test build can't catch a non-DEBUG-gated file that references a
    # DEBUG-only symbol. Compile-only, no signing, no tests. Runs beside the
    # test jobs rather than ahead of them, since nothing downstream reads its
    # output (timings in docs/reference.md). `needs: native-ios-build` only
    # for the bindings cache that job guarantees, which is what keeps the Rust
    # toolchain out of here.
    name: "Native iOS: Release build"
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-26' || vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    needs: [changes, native-ios-build]
    if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: "26.5"
      - uses: taiki-e/install-action@v2.87.4
        with:
          tool: just
      - name: Cache xcodegen
        id: xcodegen-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/xcodegen
            /usr/local/share/xcodegen
          key: xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}
      # See the identical step + comment in native-ios-build: pinned to
      # 2.46.0 in lockstep across both jobs that generate the project.
      - name: Install xcodegen
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp
          /tmp/xcodegen/install.sh
      # xcodegen fails ("Invalid local package") without ios/generated, and
      # `ios-build-release`'s `_ios-sync` reads the stamp inside it to decide
      # whether to regenerate: on a hit it doesn't, so no cargo is needed.
      # This job has no Rust toolchain, so a miss is fatal either way and had
      # better say so here rather than inside cargo-swift.
      - name: Restore generated Swift bindings
        uses: actions/cache/restore@v6
        with:
          path: ios/generated
          key: ios-bindings-cargoswift-0.9.0-${{ runner.os }}-${{ hashFiles('crates/intrada-core/src/**', 'crates/intrada-ffi/src/**', 'crates/intrada-core/Cargo.toml', 'crates/intrada-ffi/Cargo.toml', 'Cargo.lock') }}
          fail-on-cache-miss: true
      - name: Restore SwiftPM packages
        uses: actions/cache/restore@v6
        with:
          path: ios/build/spm
          key: ios-spm-v1-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ios-spm-v1-${{ runner.os }}-
      # Release compiles into its own derivedDataPath, so it needs its own
      # cache: without one this was a cold rebuild of the whole dependency
      # tree every run. Restore here, save on main only, below.
      - name: Restore Release DerivedData
        id: dd-release-cache
        uses: actions/cache/restore@v6
        with:
          path: ios/build/dd-release
          key: ios-dd-release-v1-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/Intrada/**') }}
          restore-keys: |
            ios-dd-release-v1-${{ runner.os }}-
      - name: Build Release (just ios-build-release)
        run: just ios-build-release
      - name: Save Release DerivedData
        if: github.ref == 'refs/heads/main' && steps.dd-release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ios/build/dd-release
          key: ${{ steps.dd-release-cache.outputs.cache-primary-key }}

  native-ios-test-unit:
    # Test half 1/2 (#1207): IntradaTests (unit + snapshot) against the
    # products `native-ios-build` already built — no rebuild here. Also owns
    # the main-only launch+screenshot smoke, since it already has the built
    # app on disk via the downloaded artifact.
    name: "Native iOS: unit + snapshot"
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-26' || vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 20
    needs: [changes, native-ios-build]
    if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: "26.5"
      - uses: taiki-e/install-action@v2.87.4
        with:
          tool: just
      # The `.xctestrun` in the downloaded products names its own test
      # bundles, host app and platform, so this job needs no Xcode project,
      # no `ios/generated`, and no 928MB SwiftPM restore to resolve a package
      # graph it never compiles.
      - name: Download built test products
        uses: actions/download-artifact@v8
        with:
          name: native-ios-test-products
          path: ios/build/dd/Build/Products
      - name: Test (unit + snapshot)
        run: just _ios-test-without-building -only-testing:IntradaTests 0
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: ios/IntradaTests/__Snapshots__/
          retention-days: 7
          if-no-files-found: ignore
      # REUSE_BUILD: the test step above's downloaded artifact already has
      # build/dd/Build/Products/Intrada.app — install + launch it for the
      # screenshot without rebuilding. Main only (~105s): the unit/snapshot
      # run is the per-PR UI regression gate; the launch+screenshot is a "does
      # the real app boot through its FFI entry point" smoke + visual
      # artifact, which only main needs.
      - name: Launch on simulator + screenshot
        if: github.event_name == 'push'
        run: REUSE_BUILD=1 bash scripts/ios-run-sim.sh "$GITHUB_WORKSPACE/ios-screenshots/native.png"
      - name: Upload screenshot
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-screenshot
          path: ios-screenshots/
          retention-days: 7
          if-no-files-found: ignore

  native-ios-test-ui:
    # Test half 2/2 (#1207): IntradaUITests against the products
    # `native-ios-build` already built — no rebuild here. Keeps the
    # relaunch-on-crash retry flags (#1203) scoped to this job only, so a UI
    # flake's retry can't also re-run (and re-cost) the unit/snapshot suite.
    #
    # Sliced across two runners because `SessionBuilderUITests` is over a
    # third of the suite on its own (#947; timings in docs/reference.md). The
    # slices are a whole class and its complement, expressed as a skip, so a
    # UI class added later joins the second slice instead of silently running
    # nowhere (the #1456 failure mode). xcodebuild's own parallel testing
    # would clone the simulator instead, which fails the runner launch under
    # memory pressure ("Application failed preflight checks").
    name: "Native iOS: UI (${{ matrix.slice }})"
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-26' || vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 20
    needs: [changes, native-ios-build]
    if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: builder
            filters: "-only-testing:IntradaUITests/SessionBuilderUITests"
          - slice: rest
            filters: "-skip-testing:IntradaTests -skip-testing:IntradaUITests/SessionBuilderUITests"
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: "26.5"
      - uses: taiki-e/install-action@v2.87.4
        with:
          tool: just
      # See the identical comment in native-ios-test-unit: the artifact's
      # `.xctestrun` is all this job needs to run the suite.
      - name: Download built test products
        uses: actions/download-artifact@v8
        with:
          name: native-ios-test-products
          path: ios/build/dd/Build/Products
      - name: Test (UI, ${{ matrix.slice }})
        run: just _ios-test-without-building "${{ matrix.filters }}" 1

  # Fan-in gate (#1207): branch protection's required status check is this
  # job's `name:`, unchanged from before the fan-out, so splitting the build
  # and test jobs above needs no required-checks reconfiguration on GitHub.
  # Skips in lockstep with the fanned-out jobs (same `if:`) — a skip is a pass
  # for a required check, same as the single job's skip was before #1207.
  native-ios:
    name: Native iOS (build + test)
    runs-on: ubuntu-latest
    needs: [changes, native-ios-build, native-ios-build-release, native-ios-test-unit, native-ios-test-ui]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.native == 'true')
    steps:
      - name: Check fan-out results
        run: |
          echo "build=${{ needs.native-ios-build.result }} release=${{ needs.native-ios-build-release.result }} unit=${{ needs.native-ios-test-unit.result }} ui=${{ needs.native-ios-test-ui.result }}"
          for r in "${{ needs.native-ios-build.result }}" "${{ needs.native-ios-build-release.result }}" "${{ needs.native-ios-test-unit.result }}" "${{ needs.native-ios-test-ui.result }}"; do
            if [ "$r" != "success" ]; then
              echo "✗ native-ios fan-out did not all succeed" >&2
              exit 1
            fi
          done

  # Cheap (<5s, no macOS) guard that keeps the snapshot-reference suite from
  # bloating git history: every PNG must map to a current test (no orphans) and
  # stay under the size ceiling (catches un-optimized references — Xcode writes a
  # redundant alpha channel; `just ios-snapshots-optimize` strips it). See
  # .claude/skills/intrada-ios-quality/SKILL.md.
  snapshot-hygiene:
    name: Snapshot Hygiene
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Check snapshot references (orphans + size ceiling)
        run: bash scripts/check-snapshots.sh

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The same comment-density gate as the local pre-push hook, enforced for
  # everyone — an opt-in hook is effectively off (.claude/skills/intrada-ios-quality/SKILL.md "stated invariant =
  # enforced invariant"). HEAD is detached on a PR checkout, so the base branch
  # is passed explicitly via COMMENT_CHECK_BASE. CI can't see the local
  # SKIP_COMMENT_CHECK env var, so a genuinely justified case bypasses here
  # via the comments-justified PR label instead (#1433).
  comment-density:
    name: Comment density
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'comments-justified')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check comment density
        env:
          COMMENT_CHECK_BASE: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          bash scripts/check-comment-density.sh

  # The same diff-scoped enforcement as the local pre-push hook, on for
  # everyone, since an opt-in hook is effectively off. HEAD is detached on a PR
  # checkout, so the base is passed explicitly via DASH_CHECK_BASE.
  dash-check:
    name: No em or en dashes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for added em or en dashes
        env:
          DASH_CHECK_BASE: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          bash scripts/check-dashes.sh

  security:
    # The name is load-bearing: branch protection matches required checks on
    # this exact string, so renaming it orphans the required check and the PR
    # waits forever on a job that will never report again. actionlint runs here
    # too, deliberately unnamed.
    name: Security & hygiene (cargo-deny, Gitleaks, typos, cargo-shear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned: typos dictionary updates can start flagging previously-clean
      # words, failing unrelated PRs. Bump deliberately, with mise.toml.
      - uses: taiki-e/install-action@v2.87.4
        with:
          tool: typos@1.48,cargo-shear@1.13
      # actionlint is a Go binary, not a crate: install-action carries no entry
      # for it and its cargo-binstall fallback reports "actionlint is not
      # found". Fetch the pinned release directly; keep the version in lockstep
      # with mise.toml.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # ── typos ──────────────────────────────────────────────────────────
      # Source-tree spell check (docs-heavy repo; also catches identifier
      # typos clippy/swift-format never will). Project words: _typos.toml.
      # Runs BEFORE gitleaks: that action writes results.sarif into the
      # workspace and typos would flag words inside the generated file.
      - name: Spell check (typos)
        run: typos
      # ── cargo-shear ────────────────────────────────────────────────────
      # Unused workspace dependencies — catches dead deps that inflate CI builds.
      - name: Unused dependencies (cargo-shear)
        run: cargo-shear
      # ── actionlint ─────────────────────────────────────────────────────
      # A workflow's first real exercise is the event that triggers it, so a
      # schema or expression error otherwise surfaces on the merge that needed
      # it to work. Keep the pin in lockstep with mise.toml.
      - name: Workflow lint (actionlint)
        run: actionlint
      # ── cargo-deny ─────────────────────────────────────────────────────
      # Replaces cargo-audit. Checks advisories (same RustSec DB), license
      # compliance, crate bans, and source restrictions in one pass.
      # Config: deny.toml. Ignore list migrated from .cargo/audit.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
      # ── Gitleaks ───────────────────────────────────────────────────────
      # Scans for leaked secrets (API keys, tokens, credentials) in the
      # diff. ~150 built-in regex patterns, runs in seconds.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-docker-build:
    # Catches Dockerfile / API-specific build bugs on PRs. Narrowly filtered
    # to Dockerfile + intrada-api crate only — Cargo.toml, Cargo.lock, and
    # intrada-core changes are already validated by test/clippy jobs, so they
    # don't need an ~8 min Docker build. Always runs on main pushes (gates
    # deploy).
    #
    # On main pushes the resulting image is pushed to Fly's registry tagged
    # with the commit SHA, and `deploy-api` deploys that image instead of
    # rebuilding from scratch on Fly's remote builder. PRs don't push.
    name: API Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # iOS-pivot focus mode: API on hold — never runs on PRs. On main, only runs
    # when the API actually changed (Dockerfile / intrada-api / ci.yml). When it
    # didn't, this job skips → `deploy-api` (which lists it in `needs`) skips too,
    # so we don't rebuild + redeploy an unchanged image on every unrelated main
    # push. The previously-deployed API keeps running.
    if: github.event_name == 'push' && needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Fly registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      # No `cache-to: type=gha`. `mode=max` cost 1.96GB, a fifth of the repo's
      # 10GB cache allowance, and `mode=min` would export only the runtime
      # stage, never the cargo-chef dependency layer this Dockerfile is built
      # around. A cold build here measured 139s, so the allowance is worth more
      # to the iOS caches every pull request restores.
      - name: Build intrada-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: registry.fly.io/intrada-api:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy-api:
    name: Deploy API to Fly.io
    runs-on: ubuntu-latest
    # api-docker-build only runs on main when the API changed; when it skips,
    # this job skips with it (so an unchanged API isn't needlessly redeployed).
    needs: [test, clippy, fmt, api-docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Deploy the image already built, tested (via api-docker-build's gate)
      # and pushed to Fly's registry — no rebuild on Fly's remote builder.
      # GIT_SHA was baked in at CI build time via the GIT_SHA build-arg.
      - run: flyctl deploy --image registry.fly.io/intrada-api:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Create Sentry release (intrada-api)
        if: env.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: intrada-api
        with:
          environment: production
          version: ${{ github.sha }}
          set_commits: auto
          finalize: true

  # Only signal for a red run on main: PR failures are already visible on the
  # PR, so this is scoped to push events on main (#1554). gh + GITHUB_TOKEN is
  # the zero-dependency option here: no webhook secret to provision. Comments
  # on an existing open ci-red-main issue instead of opening a second so a run
  # of back-to-back red pushes doesn't spam the tracker.
  alert-on-red-main:
    name: Alert on red main
    runs-on: ubuntu-latest
    needs: [changes, test, msrv, clippy, native-ios, snapshot-hygiene, fmt, security, api-docker-build, deploy-api]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      issues: write
    steps:
      - name: File or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-red-main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Another push to main failed CI: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "CI failed on main" \
              --body "A push to main failed CI: $RUN_URL" \
              --label ci-red-main \
              --assignee jonyardley
          fi
