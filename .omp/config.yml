# Project-local OMP settings. Read only from the cwd's .omp/, so start omp from
# the repo root. Deep-merged over ~/.omp/agent/config.yml; arrays replace,
# records merge key by key.
#
# This file is docs/model-guide.md made executable. That guide was 165 lines of
# policy with nothing enforcing it, which is the failure mode CLAUDE.md names
# elsewhere: a stated invariant must be an enforced invariant.

# Prewalk hands the session to a cheaper model at the first edit after any todo
# call. It cannot tell a migration from a typo, so in this repo it inverts the
# sensitivity override in docs/model-guide.md: bridge, schema, auth and
# migration work is exactly what must go UP a level, never down. 34 of the last
# 120 commits touched crates/ and ios/ together, so that surface is the common
# case here, not the exception. Arm it deliberately per session instead:
#   omp --prewalk-into anthropic/claude-sonnet-5:xhigh
# which is the implement tier docs/model-guide.md actually names.
prewalk:
  enabled: false

# Each role below is the guide's own ladder. Only the roles that differed from
# it are set; the rest (smol, tiny, commit, vision) inherit the global config.
modelRoles:
  # "xhigh — the default; leave it for coding and agentic sessions."
  default: anthropic/claude-opus-5:xhigh
  # "Planning: Opus 5, high." Plan turns are fewer and shorter than coding ones,
  # so this is a net saving against the previous xhigh.
  plan: anthropic/claude-opus-5:high
  # The guide's top rung, for the silent-failure surfaces: the bincode bridge
  # (#846), GRDB migrations, the ActiveSession blob (#1223, #1244, #1256), auth.
  # It had no role at all before, so it was unreachable. `slow` is in the
  # default cycleOrder, which puts it one keystroke from the model switcher.
  slow: anthropic/claude-fable-5:max
  # "Sonnet 5, xhigh — conventional Tier 2 on non-sensitive surfaces." Fan-out
  # writers land here; medium sat a notch below the guide.
  task: anthropic/claude-sonnet-5:xhigh
  # "The reviewer is never weaker than the writer." Setting the role costs
  # nothing until advisor.enabled or --advisor; pair it on bridge and migration
  # work, where a wrong turn is a silent no-op rather than a crash.
  advisor: anthropic/claude-opus-5:high

# The gates in .claude/settings.json, mirrored. #1581 gave Claude Code deny
# rules for the merge, the main-branch push, the deploys and the simulator
# resets, because CLAUDE.md states all four and nothing enforced them. OMP
# reads none of that file, so this harness could still run every one of them.
# Keep the two in step.
#
# bash.patterns is an array, and a repo array REPLACES the global one rather
# than merging key by key, so the five machine-wide rules from
# ~/.omp/agent/config.yml are restated below. Omitting one drops it silently,
# which is the failure this whole file exists to avoid. Within a segment the
# first matching rule wins, so every deny precedes the prompts.
bash:
  patterns:
    # Always(4): a human reviews and merges. Agents never merge.
    - match: "*gh pr merge*"
      approval: deny
    # Never push to main, in any of the three spellings: plain, flagged
    # (push --force origin main, which the Claude Code equivalent misses
    # because of the flag in the middle), and refspec (HEAD:main and its fully
    # qualified HEAD:refs/heads/main form).
    - match: "*push*origin main*"
      approval: deny
    - match: "*push*:main*"
      approval: deny
    - match: "*push*refs/heads/main*"
      approval: deny
    # Releases and deploys are Jon's, never a session's.
    - match: "*just testflight*"
      approval: deny
    - match: "fly *"
      approval: deny
    - match: "flyctl *"
      approval: deny
    # The simulator and CoreSimulatorService are machine-global: another
    # session's sim or test run dies with them.
    - match: "*just ios-test-sim-clean*"
      approval: deny
    - match: "*simctl shutdown all*"
      approval: deny
    - match: "*simctl erase*"
      approval: deny
    # Wildcarded around killall so a signal flag cannot walk through it:
    # killall -9 CoreSimulatorService is the form .claude/settings.json denies
    # by name, and a contiguous match would miss it.
    - match: "*killall*CoreSimulatorService*"
      approval: deny
    - match: rm -rf /*
      approval: deny
    # Never cancel or re-run CI, and never bump dependencies unless asked.
    - match: "*gh run rerun*"
      approval: prompt
    - match: "*gh run cancel*"
      approval: prompt
    - match: "*gh workflow run*"
      approval: prompt
    - match: "*cargo update*"
      approval: prompt
    - match: "*cargo add*"
      approval: prompt
    - match: "*cargo remove*"
      approval: prompt
    - match: "*push --force*"
      approval: prompt

# A bash.patterns deny governs the bash tool only: the same command issued
# through eval spawns its own shell and is unaffected, and under yolo it
# resolves to allow. Every deny above therefore had a hole beside it. A prompt
# policy on eval is enforced in every mode, including yolo, and closes it.
tools:
  approval:
    eval: prompt
